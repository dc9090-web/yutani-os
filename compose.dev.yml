services:
  postgres:
    image: postgres:17-alpine
    container_name: eve-dev-postgres
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - eve_dev_pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
volumes:
  eve_dev_pg:
