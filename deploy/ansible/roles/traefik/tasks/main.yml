---
- name: Create Traefik directories
  ansible.builtin.file:
    path: "{{ base_dir }}/traefik/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ""
    - letsencrypt

- name: Secure the ACME storage file
  ansible.builtin.copy:
    content: ""
    dest: "{{ base_dir }}/traefik/letsencrypt/acme.json"
    force: false
    mode: "0600"

- name: Template Traefik static config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ base_dir }}/traefik/traefik.yml"
    mode: "0644"
  notify: Restart traefik

- name: Template Traefik dynamic config (middlewares + cross-VM routes)
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: "{{ base_dir }}/traefik/dynamic.yml"
    mode: "0644"
  # Traefik hot-reloads this file for routing changes, but a NEW router needs a
  # restart to trigger ACME cert acquisition — so restart on any change.
  notify: Restart traefik

- name: Template Traefik .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ base_dir }}/traefik/.env"
    mode: "0600"
  notify: Restart traefik

- name: Template Traefik docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ base_dir }}/traefik/docker-compose.yml"
    mode: "0644"
  notify: Restart traefik

# The lan-only allowlist needs Traefik to see the real Tailscale peer address.
# tailscaled's ts-postrouting chain masquerades any packet it forwarded (fwmark
# 0x40000) when SNAT of subnet routes is on — the default. When Tailscale's
# FORWARD jump lands above Docker's (it does after a reboot, because tailscaled
# configures netfilter after dockerd finishes), every Tailscale request to the
# published port arrives as 172.18.0.1 and gets a 403. This VM advertises no
# routes, so SNAT is pointless: keep it off. Persisted in tailscaled's prefs.
- name: Read Tailscale prefs
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs
  changed_when: false

- name: Disable Tailscale subnet-route SNAT so Traefik sees real peer IPs
  ansible.builtin.command: tailscale set --snat-subnet-routes=false
  when: not (tailscale_prefs.stdout | from_json).NoSNAT

- name: Deploy Traefik
  community.docker.docker_compose_v2:
    project_src: "{{ base_dir }}/traefik"
    state: present
